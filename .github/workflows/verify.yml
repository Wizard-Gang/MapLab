name: Delivery gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: delivery-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MAPLAB_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assert tested revision
        run: test "$(git rev-parse HEAD)" = "$MAPLAB_EXPECTED_HEAD"
      - name: Set up pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Install pinned npm
        run: npm install --global npm@12.1.0 --ignore-scripts --no-audit --no-fund
      - name: Clean install without dependency lifecycle scripts
        run: npm ci
      - name: Verify canonical contracts and build
        run: npm run check
      - name: Install Chromium and WebKit outside npm lifecycle scripts
        run: npx playwright install --with-deps chromium webkit
      - name: Run WebKit and Chromium browser tests
        run: npm run test:browser
  change-id:
    name: change-id
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assert tested revision
        run: test "$(git rev-parse HEAD)" = "$MAPLAB_EXPECTED_HEAD"
      - name: Set up pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Install pinned npm
        run: npm install --global npm@12.1.0 --ignore-scripts --no-audit --no-fund
      - name: Validate current controlled change and event
        run: npm run check:change
  security:
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert tested revision
        run: test "$(git rev-parse HEAD)" = "$MAPLAB_EXPECTED_HEAD"
      - name: Set up pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Install pinned npm
        run: npm install --global npm@12.1.0 --ignore-scripts --no-audit --no-fund
      - name: Clean install without dependency lifecycle scripts
        run: npm ci
      - name: Audit dependencies and registry signatures online
        run: npm run security
